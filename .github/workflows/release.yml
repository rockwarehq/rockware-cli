# Builds rw for every platform and publishes it here, then updates the
# Homebrew formula in rockwarehq/homebrew-tap.
#
# To release: bump the version in package.json and src/version.ts, merge,
# then push a tag `v<version>` (like v0.1.0). Run by hand to only build.
#
# Updating the tap needs the HOMEBREW_TAP_TOKEN secret: a token that can
# write contents of rockwarehq/homebrew-tap. Without it, the release is still
# published, and the tap is left alone.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} isn't v$version"; exit 1; }

      - name: Build every platform
        run: pnpm compile:all

      - uses: actions/upload-artifact@v4
        with:
          name: rw
          path: dist/release/

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          cp install.sh LICENSE THIRD_PARTY_NOTICES dist/release/
          gh release create "v$version" dist/release/* --title "rw $version" --generate-notes

      - name: Update the Homebrew formula
        if: startsWith(github.ref, 'refs/tags/v') && env.TAP_TOKEN != ''
        run: |
          version=$(node -p "require('./package.json').version")
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/rockwarehq/homebrew-tap.git" tap
          mkdir -p tap/Formula
          pnpm formula > tap/Formula/rw.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rw.rb
          git commit -m "rw $version"
          git push
