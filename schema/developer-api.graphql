"""
A production run: one job planned at one station. A station's lineup is its schedule of production runs. A closed run is the build-to-schedule record: what was planned beside what happened.
"""
type ProductionRun {
  """Scheduled minutes from the job change to first production."""
  actualChangeoverMinutes: Int
  closeReason: ProductionRunCloseReason
  closedAt: DateTime

  """The plant's business day (YYYY-MM-DD), in the site's time zone."""
  closedBusinessDate: String
  createdAt: DateTime!

  """Should end by: raises an alert when at risk."""
  endBy: DateTime
  endByMissed: Boolean!

  """
  Its ids in your own systems, such as your work order id: one for each source.
  """
  externalIds: [ExternalId!]!
  id: ID!
  job: Job

  """When the station changed to its job."""
  jobChangedAt: DateTime
  jobId: ID!
  parts: [ProductionRunPart!]!

  """The plant's business day (YYYY-MM-DD), in the site's time zone."""
  plannedBusinessDate: String

  """Changeover minutes planned, set when it starts."""
  plannedChangeoverMinutes: Int

  """The planned end, the same way."""
  plannedEnd: DateTime

  """The shift of the planned start."""
  plannedShiftName: String

  """
  The planned start, by the job's standard, as of the last change to the lineup.
  """
  plannedStart: DateTime

  """When every part met its count."""
  quantityMetAt: DateTime

  """
  Its place among the station's queued runs: lower runs first. Station.lineup has the order now.
  """
  rank: Int!

  """First production after the changeover."""
  runStartedAt: DateTime

  """How many times another run started in its place."""
  skipCount: Int!

  """Should start by: raises an alert when at risk."""
  startBy: DateTime
  startByMissed: Boolean!
  station: Station
  stationId: ID!
  status: ProductionRunStatus!
  updatedAt: DateTime!
  workcenterId: ID!
}

"""How a run closed."""
enum ProductionRunCloseReason {
  """Every part met its count."""
  MET

  """Every part met its count, and at least one went over the tolerance."""
  OVER

  """The job changed before every part met its count."""
  SHORT

  """Skipped and closed without running: a missed plan."""
  SKIPPED
}

type ProductionRunConnection {
  nodes: [ProductionRun!]!
  pageInfo: PageInfo!
}

"""
A run: one job at one station, such as one of your work orders. Fields left out are left as they are; null clears startBy or endBy.
"""
input ProductionRunInput {
  """
  true takes a queued run off the lineup. A running run is ended in the plant.
  """
  cancel: Boolean

  """Should end by. Raises an alert in the plant when at risk."""
  endBy: DateTime

  """Its id in your system, such as your work order id."""
  externalId: String!

  """The job's externalId, or its id. Needed for a new run."""
  job: String

  """Good ones needed, per part. Wins over quantity for the parts it names."""
  parts: [ProductionRunPartInput!]

  """Good ones needed, for every part the job makes."""
  quantity: Float

  """Should start by. Raises an alert in the plant when at risk."""
  startBy: DateTime

  """The station's externalId, or its id. Needed for a new run."""
  station: String
}

"""One product a run makes, and how many good ones it needs."""
type ProductionRunPart {
  """
  Good ones made, saved when the run closes. For a running run, see Station.lineup.
  """
  goodCount: Decimal

  """When it reached its count."""
  metAt: DateTime

  """How many each cycle makes."""
  perCycle: Int!
  product: Product
  productId: ID!

  """Good ones needed."""
  requiredGood: Decimal!

  """Scrap, saved when the run closes."""
  scrapCount: Decimal
}

input ProductionRunPartInput {
  """
  The product's externalId, its id, or its SKU. The run's job must make it.
  """
  product: String!

  """Good ones needed."""
  requiredGood: Float!
}

"""Where a run is in its life. CLOSED and REMOVED are final."""
enum ProductionRunStatus {
  """
  Rolled off when the station changed to another job, or skipped. See closeReason.
  """
  CLOSED

  """Waiting its turn at the station."""
  QUEUED

  """Taken off the lineup before it ran."""
  REMOVED

  """The station changed to its job; it's counting toward it."""
  RUNNING
}

"""Read your site's records. Every query is limited to your token's site."""
type Query {
  customer(id: ID!): Customer

  """Customer records at your site, oldest change first."""
  customers(
    """The endCursor of the previous page."""
    after: String

    """How many (1 to 100, default 50)."""
    first: Int

    """Include deleted records (they have deletedAt set)."""
    includeDeleted: Boolean

    """Only records changed at or after this time."""
    updatedSince: DateTime
  ): CustomerConnection!
  job(id: ID!): Job

  """Job records at your site, oldest change first."""
  jobs(
    """The endCursor of the previous page."""
    after: String

    """How many (1 to 100, default 50)."""
    first: Int

    """Include deleted records (they have deletedAt set)."""
    includeDeleted: Boolean

    """Only records changed at or after this time."""
    updatedSince: DateTime
  ): JobConnection!
  material(id: ID!): Material

  """Material records at your site, oldest change first."""
  materials(
    """The endCursor of the previous page."""
    after: String

    """How many (1 to 100, default 50)."""
    first: Int

    """Include deleted records (they have deletedAt set)."""
    includeDeleted: Boolean

    """Only records changed at or after this time."""
    updatedSince: DateTime
  ): MaterialConnection!
  order(id: ID!): Order

  """Order records at your site, oldest change first."""
  orders(
    """The endCursor of the previous page."""
    after: String

    """How many (1 to 100, default 50)."""
    first: Int

    """Include deleted records (they have deletedAt set)."""
    includeDeleted: Boolean

    """Only records changed at or after this time."""
    updatedSince: DateTime
  ): OrderConnection!
  product(id: ID!): Product
  productionRun(id: ID!): ProductionRun

  """ProductionRun records at your site, oldest change first."""
  productionRuns(
    """The endCursor of the previous page."""
    after: String

    """How many (1 to 100, default 50)."""
    first: Int

    """Include deleted records (they have deletedAt set)."""
    includeDeleted: Boolean

    """Only records changed at or after this time."""
    updatedSince: DateTime
  ): ProductionRunConnection!

  """Product records at your site, oldest change first."""
  products(
    """The endCursor of the previous page."""
    after: String

    """How many (1 to 100, default 50)."""
    first: Int

    """Include deleted records (they have deletedAt set)."""
    includeDeleted: Boolean

    """Only records changed at or after this time."""
    updatedSince: DateTime
  ): ProductConnection!
  site: Site
  station(id: ID!): Station

  """Station records at your site, oldest change first."""
  stations(
    """The endCursor of the previous page."""
    after: String

    """How many (1 to 100, default 50)."""
    first: Int

    """Include deleted records (they have deletedAt set)."""
    includeDeleted: Boolean

    """Only records changed at or after this time."""
    updatedSince: DateTime
  ): StationConnection!

  """A webhook's deliveries, newest first. Needs webhooks:write."""
  webhookDeliveries(
    """1 to 100, default 50."""
    first: Int
    status: WebhookDeliveryStatus
    webhookId: ID!
  ): [WebhookDelivery!]!

  """This site's webhooks. Needs webhooks:write."""
  webhooks: [Webhook!]!
  workcenter(id: ID!): Workcenter

  """Workcenter records at your site, oldest change first."""
  workcenters(
    """The endCursor of the previous page."""
    after: String

    """How many (1 to 100, default 50)."""
    first: Int

    """Include deleted records (they have deletedAt set)."""
    includeDeleted: Boolean

    """Only records changed at or after this time."""
    updatedSince: DateTime
  ): WorkcenterConnection!
}

"""If errors is not empty, the order wasn't changed."""
type SequenceLineupPayload {
  action: UpsertAction
  errors: [UpsertError!]!

  """The station, to read its lineup now."""
  station: Station
}

"""The site (plant) your token belongs to."""
type Site {
  description: String
  id: ID!
  name: String!

  """IANA time zone, e.g. America/Chicago."""
  timezone: String!
