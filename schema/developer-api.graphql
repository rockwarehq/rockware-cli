"""What a write did."""
enum UpsertAction {
  """A new record was made."""
  CREATED

  """The record already matched; nothing was saved."""
  UNCHANGED

  """The record was changed."""
  UPDATED
}

"""Something wrong with what was sent. Nothing it is about was saved."""
type UpsertError {
  """A short code to check for, e.g. UNKNOWN_PRODUCT."""
  code: String!

  """Which input it is about, e.g. products[2].sku."""
  field: String
  message: String!
}

"""
If errors is not empty, nothing was saved: fix them and send the whole list again.
"""
type UpsertMaterialsPayload {
  errors: [UpsertError!]!
  results: [UpsertedMaterial!]!
}

"""
If errors is not empty, the order wasn't changed (order is what it is now, if it exists).
"""
type UpsertOrderPayload {
  action: UpsertAction
  errors: [UpsertError!]!
  order: Order
}

"""
If a run had a problem in what was sent, nothing was saved. If the lineup's rules refused a run (errors with a code like SAME_JOB_TWICE), the runs in results were still saved.
"""
type UpsertProductionRunsPayload {
  errors: [UpsertError!]!
  results: [UpsertedProductionRun!]!
}

"""
If errors is not empty, nothing was saved: fix them and send the whole list again.
"""
type UpsertProductsPayload {
  errors: [UpsertError!]!
  results: [UpsertedProduct!]!
}

type UpsertedMaterial {
  action: UpsertAction!
  externalId: String!
  material: Material
}

type UpsertedProduct {
  action: UpsertAction!
  externalId: String!
  product: Product
}

type UpsertedProductionRun {
  action: UpsertAction!
  externalId: String!
  run: ProductionRun
}

"""
Sends a signed POST to your URL when a record changes. The body is { id, type, occurredAt, siteId, data: { object, id } }: ids only, so fetch the record over /graphql.
"""
type Webhook {
  createdAt: DateTime!
  enabled: Boolean!
  events: [WebhookEventType!]!
  id: ID!
  updatedAt: DateTime!
  url: String!
}

type WebhookDelivery {
  attempts: Int!
  error: String

  """The Rockware-Event-Id it was sent with."""
  eventId: String
  finishedAt: DateTime
  id: ID!
  nextAttemptAt: DateTime

  """Your URL's HTTP status, last try."""
  responseStatus: Int
  startedAt: DateTime!
  status: WebhookDeliveryStatus!
  type: String
}

enum WebhookDeliveryStatus {
  """It failed, and won't be sent again unless you redeliver it."""
  FAILED

  """Being sent now."""
  PENDING

  """It failed, and will be sent again at nextAttemptAt."""
  RETRYING

  """Your URL answered 2xx."""
  SUCCEEDED
}

"""
A kind of record change a webhook can follow. ORDER_UPDATED is sent as type "order.updated", and so on.
"""
enum WebhookEventType {
  CUSTOMER_CREATED
  CUSTOMER_DELETED
  CUSTOMER_UPDATED
  JOB_CREATED
  JOB_DELETED
  JOB_UPDATED
  LINEUP_RUN_CREATED
  LINEUP_RUN_UPDATED
  MATERIAL_CREATED
  MATERIAL_DELETED
  MATERIAL_UPDATED
  ORDER_CREATED
  ORDER_DELETED
  ORDER_UPDATED
  PRODUCT_CREATED
  PRODUCT_DELETED
  PRODUCT_UPDATED
}

input WebhookInput {
  enabled: Boolean
  events: [WebhookEventType!]!

  """An https URL on the public internet."""
  url: String!
}

"""Only the fields you send change. events is the whole new list."""
input WebhookUpdateInput {
  enabled: Boolean
  events: [WebhookEventType!]
  url: String
}

"""
A webhook and its signing secret. The secret is shown only here, so store it now.
"""
type WebhookWithSecret {
  """
  Check each request's Rockware-Signature header with it. See the developer guide.
  """
  secret: String!
  webhook: Webhook!
}

enum WeightUnit {
  G
  KG
  LB
  OZ
}

