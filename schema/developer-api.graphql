A group of stations (a cell or line). Workcenters can sit inside other workcenters.
"""
type Workcenter {
  createdAt: DateTime!
  description: String

  """
  Its ids in your own systems: the externalId you sent it with, one for each source.
  """
  externalIds: [ExternalId!]!
  id: ID!
  name: String!
  parentId: ID
  updatedAt: DateTime!
}

type WorkcenterConnection {
  nodes: [Workcenter!]!
  pageInfo: PageInfo!
}
